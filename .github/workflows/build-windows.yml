name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install workspace deps
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Self-check
        run: npm run check

      - name: Bundle fused backend (esbuild)
        run: |
          npm install --save-dev esbuild
          node scripts/bundle.mjs

      - name: Prepare Node sidecar binary
        shell: powershell
        run: |
          $ver = "20.18.0"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          New-Item -ItemType Directory -Force -Path apps\desktop\src-tauri\binaries | Out-Null
          Copy-Item "node-dist\node-v$ver-win-x64\node.exe" "apps\desktop\src-tauri\binaries\reasonix-backend.exe"

      - name: Build installer (Tauri NSIS)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-fused-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
